name: Teleprompter

options:
  bundleIdPrefix: com.rackslabs
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  # El español es el idioma de origen —las cadenas del código están en español—
  # y el inglés se traduce en los catálogos.
  developmentLanguage: es
  knownRegions: [es, en, Base]

packages:
  TeleprompterKit:
    path: Packages/TeleprompterKit

targets:
  Teleprompter:
    type: application
    # Un solo target para las tres máquinas: compra universal y una sola ficha
    # en la App Store.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Teleprompter
    dependencies:
      - package: TeleprompterKit
        products: [PrompterCore, PrompterClient, PrompterServer]
    entitlements:
      path: Teleprompter/Teleprompter.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Alojar la sesión necesita servidor; unirse a otra, cliente.
        com.apple.security.network.server: true
        com.apple.security.network.client: true
        # El escáner de QR para unirse a una sesión.
        com.apple.security.device.camera: true
    info:
      path: Teleprompter/Info.plist
      properties:
        CFBundleDisplayName: Universal Teleprompter
        # La Mac App Store rechaza el paquete sin esto (error 90242). Es la
        # categoría en forma de UTI, y tiene que cuadrar con la de la ficha.
        LSApplicationCategoryType: public.app-category.video
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "2"
        # Sin este tipo declarado, NWBrowser no encuentra nada y encima no
        # avisa: se queda buscando en silencio para siempre.
        NSBonjourServices:
          - _uprompter._tcp
        NSLocalNetworkUsageDescription: >-
          Universal Teleprompter conecta tu Mac, iPad y iPhone por tu red local
          para que el editor, el visor y el mando vayan sincronizados durante la
          grabación. Tu guion nunca sale de tu red.
        NSCameraUsageDescription: >-
          La cámara solo se usa para leer el código QR con el que te unes a una
          sesión de otro aparato.
        # No hay criptografía propia: solo la del sistema.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.rackslabs.teleprompter.join
            CFBundleURLSchemes: [uprompter]
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # El visor es innegociablemente oscuro y el resto le acompaña.
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rackslabs.teleprompter
        PRODUCT_NAME: Universal Teleprompter
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_ASSET_PATHS: ""
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 25G3Q8388L
        # El sandbox y sus permisos son cosa de macOS. En iOS no pintan nada y
        # además hacen fallar el aprovisionamiento, porque el perfil no trae
        # derechos que allí no existen.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Teleprompter/Teleprompter.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

schemes:
  Teleprompter:
    build:
      targets:
        Teleprompter: all
    run:
      config: Debug
    archive:
      config: Release
